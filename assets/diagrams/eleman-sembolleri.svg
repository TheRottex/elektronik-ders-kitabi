<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Elektronik elemanların sadeleştirilmiş devre sembolleri</title>
  <desc id="desc">Direnç, potansiyometre, kondansatör, bobin, diyot, LED, NPN transistör ve transformatör şematik simgeleri.</desc>
  <defs><style>
    .h{font:700 27px system-ui,sans-serif;fill:#17384f}.name{font:700 18px system-ui,sans-serif;fill:#244b64}.sub{font:15px system-ui,sans-serif;fill:#5a7283}.line{stroke:#315b74;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.sym{stroke:#147e8c;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#d7e4eb;stroke-width:2}
  </style></defs>
  <rect width="1100" height="620" rx="24" fill="#f6fafc"/>
  <text x="42" y="52" class="h">ŞEMATİK SEMBOLLER • bacakları ve kutupları gerçek parçanın veri sayfasından doğrula</text>
  <!-- cards -->
  <g>
    <rect x="35" y="82" width="245" height="220" rx="18" class="card"/>
    <rect x="305" y="82" width="245" height="220" rx="18" class="card"/>
    <rect x="575" y="82" width="245" height="220" rx="18" class="card"/>
    <rect x="845" y="82" width="220" height="220" rx="18" class="card"/>
    <rect x="35" y="330" width="245" height="220" rx="18" class="card"/>
    <rect x="305" y="330" width="245" height="220" rx="18" class="card"/>
    <rect x="575" y="330" width="245" height="220" rx="18" class="card"/>
    <rect x="845" y="330" width="220" height="220" rx="18" class="card"/>
  </g>
  <!-- resistor -->
  <path class="line" d="M60 175H95 M95 175l15-22 20 44 20-44 20 44 20-44 20 22h35"/>
  <text x="155" y="245" text-anchor="middle" class="name">Direnç • R • Ω</text>
  <text x="155" y="273" text-anchor="middle" class="sub">Akımı sınırlar</text>
  <!-- capacitor -->
  <path class="line" d="M332 175H405 M450 175H523"/><path class="sym" d="M405 135V215 M450 135V215"/>
  <text x="428" y="245" text-anchor="middle" class="name">Kondansatör • C</text>
  <text x="428" y="273" text-anchor="middle" class="sub">Yük/enerji depolar</text>
  <!-- inductor -->
  <path class="line" d="M600 175H630 M630 175c0-45 38-45 38 0s38 45 38 0 38-45 38 0 38 45 38 0h20"/>
  <text x="698" y="245" text-anchor="middle" class="name">Bobin • L • H</text>
  <text x="698" y="273" text-anchor="middle" class="sub">Manyetik alan oluşturur</text>
  <!-- diode -->
  <path class="line" d="M865 175H910 M1000 175H1040"/><path class="sym" d="M910 140 970 175 910 210Z M970 140V210"/>
  <text x="955" y="245" text-anchor="middle" class="name">Diyot • A → K</text>
  <text x="955" y="273" text-anchor="middle" class="sub">Tek yönde iletir</text>
  <!-- LED -->
  <path class="line" d="M60 420H105 M190 420H245"/><path class="sym" d="M105 385 165 420 105 455Z M165 385V455 M175 380l28-28 M193 355h10v10 M180 392l28-28 M200 368h10v10"/>
  <text x="155" y="495" text-anchor="middle" class="name">LED</text><text x="155" y="523" text-anchor="middle" class="sub">Işık yayan diyot</text>
  <!-- pot -->
  <path class="line" d="M332 420H360 M360 420l16-20 20 40 20-40 20 40 20-40 16 20h42 M420 460v-40"/>
  <path class="sym" d="M445 370 425 400 M438 371h10v10"/>
  <text x="428" y="495" text-anchor="middle" class="name">Potansiyometre</text><text x="428" y="523" text-anchor="middle" class="sub">Ayarlanabilir direnç</text>
  <!-- transistor NPN -->
  <path class="line" d="M600 420H650 M650 390 705 355 M650 450 705 485 M650 390V450 M705 355V485 M705 355H790 M705 485H790"/>
  <path d="M675 466l24 16-28 3" fill="#315b74"/>
  <text x="698" y="515" text-anchor="middle" class="name">NPN transistör</text><text x="698" y="540" text-anchor="middle" class="sub">Beyz ile C–E yolunu kontrol eder</text>
  <!-- transformer -->
  <path class="line" d="M870 420H895 M895 420c0-32 28-32 28 0s28 32 28 0 28-32 28 0 28 32 28 0h20 M870 480H895 M895 480c0-32 28-32 28 0s28 32 28 0 28-32 28 0 28 32 28 0h20"/>
  <path class="sym" d="M990 390V510"/>
  <text x="955" y="540" text-anchor="middle" class="name">Transformatör</text>
</svg>
