<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">İkili sayma ve giriş kombinasyonları</title>
  <desc id="desc">İki bit için 00, 01, 10, 11; üç bit için 000'den 111'e kadar sekiz giriş durumu ve 2 üzeri n kuralı.</desc>
  <defs><style>
    .h{font:700 28px system-ui,sans-serif;fill:#17384f}.th{font:700 18px system-ui,sans-serif;fill:#fff}.td{font:600 20px system-ui,sans-serif;fill:#244b64}.s{font:16px system-ui,sans-serif;fill:#557184}.a{fill:#eaf4fb}.b{fill:#fff}.grid{stroke:#d2e0e9;stroke-width:2}
  </style></defs>
  <rect width="1080" height="560" rx="24" fill="#f7fafc"/>
  <text x="42" y="55" class="h">İkili say: her basamak yalnız 0 veya 1 alır</text>
  <rect x="45" y="95" width="400" height="380" rx="18" fill="#fff" stroke="#d7e4eb" stroke-width="2"/>
  <text x="75" y="137" class="h">2 giriş → 2² = 4 satır</text>
  <rect x="88" y="165" width="314" height="45" rx="8" fill="#2878a4"/>
  <text x="150" y="195" text-anchor="middle" class="th">A</text><text x="250" y="195" text-anchor="middle" class="th">B</text><text x="345" y="195" text-anchor="middle" class="th">İkilik</text>
  <g class="grid">
    <rect x="88" y="210" width="314" height="55" class="a"/><rect x="88" y="265" width="314" height="55" class="b"/><rect x="88" y="320" width="314" height="55" class="a"/><rect x="88" y="375" width="314" height="55" class="b"/>
    <path d="M200 210V430M300 210V430M88 265H402M88 320H402M88 375H402" fill="none" class="grid"/>
  </g>
  <text x="150" y="247" text-anchor="middle" class="td">0</text><text x="250" y="247" text-anchor="middle" class="td">0</text><text x="345" y="247" text-anchor="middle" class="td">00</text>
  <text x="150" y="302" text-anchor="middle" class="td">0</text><text x="250" y="302" text-anchor="middle" class="td">1</text><text x="345" y="302" text-anchor="middle" class="td">01</text>
  <text x="150" y="357" text-anchor="middle" class="td">1</text><text x="250" y="357" text-anchor="middle" class="td">0</text><text x="345" y="357" text-anchor="middle" class="td">10</text>
  <text x="150" y="412" text-anchor="middle" class="td">1</text><text x="250" y="412" text-anchor="middle" class="td">1</text><text x="345" y="412" text-anchor="middle" class="td">11</text>
  <text x="90" y="462" class="s">En sağdaki bit her satırda değişir.</text>
  <rect x="480" y="95" width="555" height="380" rx="18" fill="#fff" stroke="#d7e4eb" stroke-width="2"/>
  <text x="515" y="137" class="h">3 giriş → 2³ = 8 satır</text>
  <g>
    <rect x="525" y="165" width="465" height="45" rx="8" fill="#2878a4"/>
    <text x="610" y="195" text-anchor="middle" class="th">A</text><text x="750" y="195" text-anchor="middle" class="th">B</text><text x="900" y="195" text-anchor="middle" class="th">C</text>
    <rect x="525" y="210" width="465" height="220" fill="#fff" class="grid"/>
    <path d="M680 210V430M835 210V430M525 237.5H990M525 265H990M525 292.5H990M525 320H990M525 347.5H990M525 375H990M525 402.5H990" class="grid"/>
    <g class="td" text-anchor="middle">
      <text x="610" y="233">0</text><text x="750" y="233">0</text><text x="900" y="233">0</text>
      <text x="610" y="261">0</text><text x="750" y="261">0</text><text x="900" y="261">1</text>
      <text x="610" y="289">0</text><text x="750" y="289">1</text><text x="900" y="289">0</text>
      <text x="610" y="316">0</text><text x="750" y="316">1</text><text x="900" y="316">1</text>
      <text x="610" y="344">1</text><text x="750" y="344">0</text><text x="900" y="344">0</text>
      <text x="610" y="371">1</text><text x="750" y="371">0</text><text x="900" y="371">1</text>
      <text x="610" y="399">1</text><text x="750" y="399">1</text><text x="900" y="399">0</text>
      <text x="610" y="426">1</text><text x="750" y="426">1</text><text x="900" y="426">1</text>
    </g>
  </g>
  <text x="515" y="462" class="s">En soldaki bit dört satırda bir değişir.</text>
  <text x="60" y="525" class="h">Genel kural: n bağımsız ikili giriş → 2ⁿ farklı satır</text>
</svg>
