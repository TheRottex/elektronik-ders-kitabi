<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Mikrodenetleyicide dijital giriş, program ve çıkış</title>
  <desc id="desc">Pull-up girişine bağlı buton, mikrodenetleyici işlemci bloğu ve akım sınırlama direnciyle bağlı LED çıkışı.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3281a7"/></marker><style>
    .h{font:700 27px system-ui,sans-serif;fill:#17384f}.t{font:600 19px system-ui,sans-serif;fill:#244b64}.s{font:16px system-ui,sans-serif;fill:#587184}.box{stroke:#bed3df;stroke-width:2}.wire{fill:none;stroke:#3d657d;stroke-width:4;stroke-linejoin:round}.a{stroke:#3281a7;stroke-width:4;marker-end:url(#arr)}.node{fill:#3d657d}
  </style></defs>
  <rect width="1200" height="600" rx="24" fill="#f7fafc"/>
  <text x="45" y="55" class="h">Mikrodenetleyici: girişi oku → kurala göre işlem yap → çıkışı sür</text>
  <!-- flow blocks -->
  <rect x="75" y="105" width="260" height="115" rx="18" fill="#fff5df" class="box"/>
  <text x="205" y="150" text-anchor="middle" class="t">GİRİŞ</text>
  <text x="205" y="185" text-anchor="middle" class="s">Buton / sensör → 0 veya 1</text>
  <rect x="470" y="105" width="260" height="115" rx="18" fill="#e9f4fd" class="box"/>
  <text x="600" y="150" text-anchor="middle" class="t">İŞLEM</text>
  <text x="600" y="185" text-anchor="middle" class="s">Program / AND / OR koşulu</text>
  <rect x="865" y="105" width="260" height="115" rx="18" fill="#e9f8ed" class="box"/>
  <text x="995" y="150" text-anchor="middle" class="t">ÇIKIŞ</text>
  <text x="995" y="185" text-anchor="middle" class="s">LED / sürücü → HIGH veya LOW</text>
  <path d="M345 163H455" class="a"/><path d="M740 163H850" class="a"/>
  <!-- button circuit -->
  <text x="75" y="280" class="t">Dijital giriş (INPUT_PULLUP)</text>
  <path class="wire" d="M145 330V385 M145 385H285 M285 330V360 M285 410V460 M145 460H285"/>
  <rect x="125" y="310" width="40" height="20" rx="4" fill="#d9ebf5" class="box"/>
  <text x="185" y="326" class="s">Dahili pull-up</text>
  <circle cx="285" cy="385" r="7" class="node"/>
  <path class="wire" d="M285 385H395"/>
  <text x="300" y="372" class="s">Pin 2</text>
  <path d="M285 385 325 350" class="wire"/>
  <circle cx="325" cy="350" r="7" class="node"/>
  <text x="320" y="430" class="s">Buton basılınca pin GND olur → LOW</text>
  <text x="160" y="490" class="s">GND</text>
  <!-- processor -->
  <rect x="445" y="300" width="260" height="170" rx="18" fill="#e9f4fd" class="box"/>
  <text x="575" y="355" text-anchor="middle" class="t">Mikrodenetleyici</text>
  <text x="575" y="390" text-anchor="middle" class="s">if (buton basılı)</text>
  <text x="575" y="422" text-anchor="middle" class="s">LED çıkışını HIGH yap</text>
  <path d="M395 385H430" class="a"/>
  <!-- led output -->
  <text x="790" y="280" class="t">Dijital çıkış ve seri direnç</text>
  <path class="wire" d="M705 385H815 M900 385H955 M1005 385H1090V465H815V385"/>
  <rect x="815" y="365" width="85" height="40" rx="7" fill="#fff0ca" stroke="#d69522" stroke-width="3"/>
  <text x="857" y="391" text-anchor="middle" class="s">R</text>
  <path d="M955 355 1005 385 955 415Z" fill="#e9f8ed" stroke="#328c57" stroke-width="3"/>
  <path d="M1005 355V415" stroke="#328c57" stroke-width="4"/>
  <path d="M965 345 950 328M985 345 970 328" stroke="#328c57" stroke-width="3"/>
  <text x="980" y="438" class="s">LED</text>
  <path d="M705 385H795" class="a"/>
  <text x="785" y="500" class="s">Kart GND dönüşü</text>
  <text x="75" y="550" class="s">Besleme voltajı ve pin sınırlarını kart veri sayfasından kontrol et; LED'i dirençsiz bağlama.</text>
</svg>
